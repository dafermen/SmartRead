name: SmartRead CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    name: Syntax and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run baseline checks
        run: npm test
